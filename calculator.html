<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanta – Scientific Calculator</title>
<style>
  :root {
    --bg1: #0a0e16;
    --bg2: #151d2e;
    --card: #121927;
    --screen: #0b1019;
    --key: #1b2537;
    --key-hover: #243350;
    --fn: #162033;
    --fn-hover: #1f2c46;
    --op: #22406f;
    --op-hover: #2b5191;
    --accent: #4f8cff;
    --accent-2: #2f6bff;
    --danger: #ff6674;
    --text: #e9efff;
    --muted: #8795b3;
    --border: #25324b;
    --shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .03) inset;
    --key-shadow: 0 2px 0 rgba(0, 0, 0, .35), 0 1px 0 rgba(255, 255, 255, .05) inset;
  }
  [data-theme="light"] {
    --bg1: #e9eef8;
    --bg2: #cfd9ee;
    --card: #f7f9fe;
    --screen: #ffffff;
    --key: #ffffff;
    --key-hover: #eef3ff;
    --fn: #eef2fa;
    --fn-hover: #e1e9f8;
    --op: #dbe7ff;
    --op-hover: #c7daff;
    --accent: #2f6bff;
    --accent-2: #1f55e0;
    --danger: #e5384a;
    --text: #172036;
    --muted: #6b7794;
    --border: #d8e0f0;
    --shadow: 0 30px 70px rgba(40, 60, 110, .25), 0 0 0 1px rgba(255, 255, 255, .6) inset;
    --key-shadow: 0 2px 0 rgba(30, 50, 100, .12), 0 1px 0 rgba(255, 255, 255, .9) inset;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(1200px 700px at 15% -10%, var(--bg2), transparent 60%),
                radial-gradient(900px 600px at 100% 110%, var(--bg2), transparent 55%),
                var(--bg1);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    transition: background .3s;
  }

  .calc {
    position: relative; overflow: hidden;
    width: min(840px, 100%);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 26px;
    box-shadow: var(--shadow);
    padding: 18px;
    user-select: none; -webkit-user-select: none;
  }

  /* Header */
  .bar { display: flex; align-items: center; justify-content: space-between; margin: 2px 4px 14px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    font-size: 21px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent), #8a5bff);
    box-shadow: 0 6px 18px rgba(79, 140, 255, .4);
  }
  .brand b { display: block; font-size: 16px; letter-spacing: .4px; }
  .brand small { color: var(--muted); font-size: 12px; letter-spacing: .3px; }
  .tools { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--fn); color: var(--muted); cursor: pointer; display: grid; place-items: center;
    transition: all .15s;
  }
  .icon-btn:hover { color: var(--text); background: var(--fn-hover); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Display */
  .screen {
    background: var(--screen);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 12px 18px 14px;
    margin-bottom: 16px;
    box-shadow: inset 0 2px 14px rgba(0, 0, 0, .25);
    min-height: 148px;
    display: flex; flex-direction: column;
  }
  .badges { display: flex; gap: 6px; min-height: 22px; }
  .badges span {
    font-size: 10.5px; font-weight: 700; letter-spacing: 1px; padding: 3px 8px; border-radius: 6px;
    color: var(--accent); background: rgba(79, 140, 255, .12); border: 1px solid rgba(79, 140, 255, .25);
  }
  .sub {
    margin-top: auto; min-height: 24px; text-align: right; color: var(--muted);
    font-size: 17px; font-variant-numeric: tabular-nums; overflow-x: auto; white-space: nowrap;
    scrollbar-width: none;
  }
  .sub::-webkit-scrollbar, .main::-webkit-scrollbar { display: none; }
  .main {
    text-align: right; font-size: 46px; font-weight: 500; line-height: 1.2;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow-x: auto; scrollbar-width: none;
    letter-spacing: .5px; cursor: pointer;
  }
  .main.sm { font-size: 34px; }
  .main.xs { font-size: 25px; }
  .main.error { color: var(--danger); font-size: 28px; }

  /* Keys */
  .keys { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  .sci { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .k {
    height: 56px; border: 1px solid var(--border); border-radius: 13px;
    font: inherit; font-size: 16px; font-weight: 500; color: var(--text);
    background: var(--key); box-shadow: var(--key-shadow);
    cursor: pointer; transition: background .12s, transform .06s, box-shadow .12s, color .12s;
    touch-action: manipulation; display: flex; align-items: center; justify-content: center;
  }
  .k:hover { background: var(--key-hover); }
  .k:active { transform: translateY(1px) scale(.97); box-shadow: none; }
  .k:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .k sup { font-size: .65em; margin-left: 1px; transform: translateY(-2px); }
  .k.fn { background: var(--fn); font-size: 14.5px; color: var(--text); }
  .k.fn:hover { background: var(--fn-hover); }
  .k.mem { background: transparent; border-style: dashed; font-size: 13px; color: var(--muted); height: 44px; }
  .k.mem:hover { color: var(--text); background: var(--fn); }
  .k.tog { background: var(--fn); color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .5px; }
  .k.tog.on { color: #fff; background: var(--accent-2); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 140, 255, .18); }
  .k.op { background: var(--op); color: var(--accent); font-size: 21px; }
  [data-theme="dark"] .k.op { color: #a9c6ff; }
  .k.op:hover { background: var(--op-hover); }
  .k.ctl { color: var(--danger); font-weight: 600; }
  .k.num { font-size: 20px; }
  .k.eq {
    color: #fff; font-size: 24px; border-color: transparent;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 20px rgba(47, 107, 255, .35);
  }
  .k.eq:hover { filter: brightness(1.1); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .pad .k { height: 62px; }

  /* History drawer */
  .history {
    position: absolute; inset: 0 0 0 auto; width: min(340px, 100%);
    background: var(--card); border-left: 1px solid var(--border);
    transform: translateX(102%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
    display: flex; flex-direction: column; z-index: 5;
    box-shadow: -20px 0 50px rgba(0, 0, 0, .3);
  }
  .history.open { transform: none; }
  .h-head { display: flex; justify-content: space-between; align-items: center; padding: 18px; border-bottom: 1px solid var(--border); }
  .h-head h3 { font-size: 15px; letter-spacing: .4px; }
  .h-head div { display: flex; gap: 8px; }
  .h-list { flex: 1; overflow-y: auto; padding: 10px; }
  .h-item { padding: 12px 14px; border-radius: 12px; cursor: pointer; text-align: right; transition: background .12s; }
  .h-item:hover { background: var(--fn); }
  .h-item .e { color: var(--muted); font-size: 13px; word-break: break-all; }
  .h-item .r { font-size: 21px; margin-top: 2px; word-break: break-all; font-variant-numeric: tabular-nums; }
  .h-empty { color: var(--muted); text-align: center; margin-top: 60px; font-size: 14px; }

  .toast {
    position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 20px);
    background: var(--accent-2); color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 9; box-shadow: 0 8px 20px rgba(0, 0, 0, .3);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 720px) {
    body { padding: 10px; align-items: flex-start; }
    .calc { padding: 12px; border-radius: 22px; }
    .keys { grid-template-columns: 1fr; gap: 12px; }
    .k { height: 48px; font-size: 15px; }
    .k.mem { height: 38px; }
    .pad .k { height: 56px; }
    .main { font-size: 38px; }
    .main.sm { font-size: 30px; }
    .main.xs { font-size: 22px; }
    .screen { min-height: 128px; }
  }
</style>
</head>
<body>

<main class="calc" id="calc">
  <header class="bar">
    <div class="brand">
      <div class="logo">∑</div>
      <div><b>Quanta</b><small>Scientific Calculator</small></div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="btnCopy" title="Copy result" aria-label="Copy result">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
      </button>
      <button class="icon-btn" id="btnHistory" title="History" aria-label="Show history">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <section class="screen">
    <div class="badges">
      <span id="bAngle">DEG</span>
      <span id="bSecond" hidden>2ND</span>
      <span id="bMem" hidden>M</span>
    </div>
    <div class="sub" id="sub"></div>
    <div class="main" id="main" aria-live="polite" title="Click to copy">0</div>
  </section>

  <section class="keys">
    <div class="sci" id="sci"></div>
    <div class="pad" id="pad"></div>
  </section>

  <aside class="history" id="history" aria-label="History">
    <div class="h-head">
      <h3>History</h3>
      <div>
        <button class="icon-btn" id="btnClearHist" title="Clear history" aria-label="Clear history">
          <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
        </button>
        <button class="icon-btn" id="btnCloseHist" title="Close" aria-label="Close history">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="h-list" id="hList"></div>
  </aside>

  <div class="toast" id="toast"></div>
</main>

<script>
"use strict";

/* ============================================================
   Expression engine (no eval – tokenizer + recursive descent)
   ============================================================ */
const FN_NAMES = ["sin","cos","tan","asin","acos","atan","sinh","cosh","tanh","asinh","acosh","atanh","log","ln","abs","exp"];

function tokenize(s) {
  const out = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === " ") { i++; continue; }
    const rest = s.slice(i);
    let m;
    if ((m = rest.match(/^(\d+\.?\d*|\.\d+)(e[+\-\u2212]?\d+)?/))) {
      out.push({ type: "num", v: parseFloat(m[0].replace("\u2212", "-")) });
      i += m[0].length; continue;
    }
    if (c === "-" || c === "\u2212") { out.push({ type: "op", v: "\u2212" }); i++; continue; }
    if (c === "*" || c === "\u00d7") { out.push({ type: "op", v: "\u00d7" }); i++; continue; }
    if (c === "/" || c === "\u00f7") { out.push({ type: "op", v: "\u00f7" }); i++; continue; }
    if ("+^!%()".includes(c)) { out.push({ type: "op", v: c }); i++; continue; }
    if (c === "\u03c0") { out.push({ type: "const", v: Math.PI }); i++; continue; }
    if (c === "\u221a") { out.push({ type: "fn", v: "sqrt" }); i++; continue; }
    if (c === "\u221b") { out.push({ type: "fn", v: "cbrt" }); i++; continue; }
    if ((m = rest.match(/^[A-Za-z]+/))) {
      const w = m[0];
      if (w === "e") out.push({ type: "const", v: Math.E });
      else if (w === "Ans") out.push({ type: "ans" });
      else if (FN_NAMES.includes(w)) out.push({ type: "fn", v: w });
      else throw new Error("Unknown: " + w);
      i += w.length; continue;
    }
    throw new Error("Bad character");
  }
  return out;
}

function gamma(z) {
  if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
  z -= 1;
  const g = 7, p = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  let x = p[0];
  for (let i = 1; i < g + 2; i++) x += p[i] / (z + i);
  const t = z + g + 0.5;
  return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}
function factorial(n) {
  if (Number.isInteger(n)) {
    if (n < 0) return NaN;
    if (n > 170) return Infinity;
    let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
  }
  return gamma(n + 1);
}

function evaluate(src, opts) {
  const deg = !!opts.deg, ansVal = opts.ans || 0;
  const rad = x => deg ? x * Math.PI / 180 : x;
  const unrad = x => deg ? x * 180 / Math.PI : x;
  const snap = v => (Math.abs(v) < 1e-14 ? 0 : v);
  const FN = {
    sin: x => snap(Math.sin(rad(x))),
    cos: x => snap(Math.cos(rad(x))),
    tan: x => {
      if (deg && Math.abs(((x % 180) + 180) % 180 - 90) < 1e-12) return NaN;
      return snap(Math.tan(rad(x)));
    },
    asin: x => unrad(Math.asin(x)), acos: x => unrad(Math.acos(x)), atan: x => unrad(Math.atan(x)),
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    asinh: Math.asinh, acosh: Math.acosh, atanh: Math.atanh,
    log: Math.log10, ln: Math.log, sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs, exp: Math.exp
  };

  const toks = tokenize(src);
  let p = 0;
  const peek = () => toks[p];
  const next = () => toks[p++];
  const isOp = (t, ...vs) => t && t.type === "op" && vs.includes(t.v);
  const startsPrimary = t => t && (t.type === "num" || t.type === "const" || t.type === "ans" || t.type === "fn" || isOp(t, "("));

  function expr() {
    let v = term();
    while (isOp(peek(), "+", "\u2212")) {
      const o = next().v, r = term();
      v = o === "+" ? v + r : v - r;
    }
    return v;
  }
  function term() {
    let v = unary();
    for (;;) {
      const t = peek();
      if (isOp(t, "\u00d7", "\u00f7")) { next(); const r = unary(); v = t.v === "\u00d7" ? v * r : v / r; }
      else if (startsPrimary(t)) { v *= unary(); }          // implicit multiplication
      else break;
    }
    return v;
  }
  function unary() {
    const t = peek();
    if (isOp(t, "\u2212", "+")) { next(); const v = unary(); return t.v === "\u2212" ? -v : v; }
    return power();
  }
  function power() {
    const b = postfix();
    if (isOp(peek(), "^")) { next(); return Math.pow(b, unary()); }
    return b;
  }
  function postfix() {
    let v = primary();
    for (;;) {
      const t = peek();
      if (isOp(t, "!")) { next(); v = factorial(v); }
      else if (isOp(t, "%")) { next(); v /= 100; }
      else break;
    }
    return v;
  }
  function closeParen() {
    const t = peek();
    if (isOp(t, ")")) next();
    else if (t) throw new Error("Syntax error");            // missing ')' at the very end is auto-closed
  }
  function primary() {
    const t = next();
    if (!t) throw new Error("Incomplete expression");
    if (t.type === "num" || t.type === "const") return t.v;
    if (t.type === "ans") return ansVal;
    if (t.type === "fn") {
      if (!isOp(next(), "(")) throw new Error("Syntax error");
      const a = expr(); closeParen();
      return FN[t.v](a);
    }
    if (isOp(t, "(")) { const v = expr(); closeParen(); return v; }
    throw new Error("Syntax error");
  }

  if (!toks.length) throw new Error("Empty");
  const result = expr();
  if (p < toks.length) throw new Error("Syntax error");
  return result;
}

function cleanNum(v) { return Math.abs(v) < 1e-14 ? 0 : parseFloat(v.toPrecision(12)); }
function fmt(v) {
  v = cleanNum(v);
  if (v === 0) return "0";
  const a = Math.abs(v);
  if (a >= 1e15 || a < 1e-9) return v.toExponential().replace("e+", "e+");
  return String(v);
}
const fmtDisp = v => fmt(v).replace(/-/g, "\u2212");
function balance(s) {
  const open = (s.match(/\(/g) || []).length, close = (s.match(/\)/g) || []).length;
  return s + ")".repeat(Math.max(0, open - close));
}
/*END-ENGINE*/

/* ============================================================
   Calculator state & UI logic
   ============================================================ */
const $ = id => document.getElementById(id);
const state = { expr: "", evaluated: false, lastExpr: "", lastResult: null, error: null,
                deg: true, second: false, mem: 0, hasMem: false, history: [] };
const BIN = "+\u2212\u00d7\u00f7^";
const UNARY_START = /^[+\u2212\u00d7\u00f7^!%]/;
let toastTimer;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}
function save() { try { localStorage.setItem("quanta-hist", JSON.stringify(state.history)); } catch (e) {} }

function currentValue() {
  if (state.evaluated && state.lastResult !== null) return state.lastResult;
  if (!state.expr) return 0;
  try { return evaluate(state.expr, { deg: state.deg, ans: state.lastResult || 0 }); } catch (e) { return null; }
}

function render() {
  const main = $("main"), sub = $("sub");
  let text;
  main.classList.remove("error", "sm", "xs");
  if (state.error) {
    text = state.error; main.classList.add("error"); sub.textContent = "";
  } else if (state.evaluated) {
    text = fmtDisp(state.lastResult);
    sub.textContent = balance(state.lastExpr) + " =";
  } else {
    text = state.expr || "0";
    let prev = "";
    if (/[^\d.]/.test(state.expr)) {
      try {
        const v = evaluate(state.expr, { deg: state.deg, ans: state.lastResult || 0 });
        if (isFinite(v)) prev = "= " + fmtDisp(v);
      } catch (e) {}
    }
    sub.textContent = prev;
  }
  if (!state.error) {
    if (text.length > 24) main.classList.add("xs");
    else if (text.length > 14) main.classList.add("sm");
  }
  main.textContent = text;
  main.scrollLeft = main.scrollWidth;
  $("bAngle").textContent = state.deg ? "DEG" : "RAD";
  $("bSecond").hidden = !state.second;
  $("bMem").hidden = !state.hasMem;
}

function ins(t) {
  state.error = null;
  if (state.evaluated) {
    if (UNARY_START.test(t)) state.expr = fmtDisp(state.lastResult);
    else state.expr = "";
    state.evaluated = false;
  }
  let e = state.expr;
  const last = e.slice(-1);
  const isBin = t.length === 1 && BIN.includes(t);

  if (isBin) {
    if (!e) {
      if (t === "\u2212") { state.expr = "\u2212"; return render(); }
      if (state.lastResult === null) return render();
      e = "Ans";
    } else if (last === "(") {
      if (t !== "\u2212") return render();
    } else if (BIN.includes(last)) {
      if (!(t === "\u2212" && "\u00d7\u00f7^".includes(last))) e = e.slice(0, -1);
    }
  } else if (t === ".") {
    const tail = (e.match(/[\d.]*$/) || [""])[0];
    if (tail.includes(".")) return render();
    if (!tail) t = "0.";
  } else if (/^\d$/.test(t)) {
    if (/(^|[^\d.])0$/.test(e)) e = e.slice(0, -1);
  } else if (t === "e" && /\d$/.test(e)) {
    t = "\u00d7e";
  }
  state.expr = e + t;
  render();
}

function backspace() {
  state.error = null;
  if (state.evaluated) { state.evaluated = false; state.expr = ""; return render(); }
  state.expr = state.expr.replace(/(?:asinh|acosh|atanh|sinh|cosh|tanh|asin|acos|atan|sin|cos|tan|log|ln|abs|exp|\u221a|\u221b)\($|Ans$|.$/, "");
  render();
}
function clearAll() {
  state.expr = ""; state.evaluated = false; state.error = null; render();
}
function negate() {
  state.error = null;
  if (state.evaluated) { state.expr = fmtDisp(-state.lastResult); state.evaluated = false; return render(); }
  let m;
  if ((m = state.expr.match(/\(\u2212(\d+\.?\d*|\.\d+)\)$/))) state.expr = state.expr.slice(0, -m[0].length) + m[1];
  else if ((m = state.expr.match(/(\d+\.?\d*|\.\d+)$/))) state.expr = state.expr.slice(0, -m[0].length) + "(\u2212" + m[0] + ")";
  else return ins("\u2212");
  render();
}
function equals() {
  if (state.evaluated || !state.expr) return;
  try {
    const v = evaluate(state.expr, { deg: state.deg, ans: state.lastResult || 0 });
    if (Number.isNaN(v)) throw new Error("Domain error");
    if (!isFinite(v)) throw new Error(v > 0 || v < 0 ? "Cannot divide by zero" : "Math error");
    state.lastExpr = state.expr; state.lastResult = cleanNum(v);
    state.history.unshift({ e: balance(state.expr), r: fmtDisp(state.lastResult) });
    state.history = state.history.slice(0, 60);
    state.evaluated = true; state.error = null;
    save(); renderHistory();
  } catch (err) {
    state.error = /Domain|zero|Math/.test(err.message) ? err.message : "Invalid expression";
  }
  render();
}

/* memory */
function memOp(kind) {
  if (kind === "MC") { state.mem = 0; state.hasMem = false; toast("Memory cleared"); }
  else if (kind === "MR") { if (state.hasMem) ins(fmtDisp(state.mem)); else toast("Memory is empty"); }
  else {
    const v = currentValue();
    if (v === null || !isFinite(v)) return toast("Nothing to store");
    if (kind === "MS") state.mem = v;
    else if (kind === "M+") state.mem += v;
    else state.mem -= v;
    state.hasMem = true; toast("Memory: " + fmt(state.mem));
  }
  render();
}

/* toggles */
function toggleAngle() { state.deg = !state.deg; $("angleKey").textContent = state.deg ? "DEG" : "RAD"; render(); }
function toggleSecond(force) {
  state.second = typeof force === "boolean" ? force : !state.second;
  $("secondKey").classList.toggle("on", state.second);
  document.querySelectorAll("#sci .k[data-alt]").forEach(b => {
    b.innerHTML = state.second ? b.dataset.alt : b.dataset.main;
  });
  render();
}

/* ---------- key definitions ---------- */
const SCI = [
  { l: "2nd", c: "tog", id: "secondKey", r: () => toggleSecond() },
  { l: "DEG", c: "tog", id: "angleKey", r: toggleAngle },
  { l: "\u03c0", c: "fn", r: () => ins("\u03c0") },
  { l: "e", c: "fn", r: () => ins("e") },
  { l: "Ans", c: "fn", r: () => ins("Ans") },

  { l: "sin", a: "sin<sup>\u22121</sup>", c: "fn", r: () => ins("sin("), ar: () => ins("asin(") },
  { l: "cos", a: "cos<sup>\u22121</sup>", c: "fn", r: () => ins("cos("), ar: () => ins("acos(") },
  { l: "tan", a: "tan<sup>\u22121</sup>", c: "fn", r: () => ins("tan("), ar: () => ins("atan(") },
  { l: "log", a: "10<sup>x</sup>", c: "fn", r: () => ins("log("), ar: () => ins("10^(") },
  { l: "ln",  a: "e<sup>x</sup>",  c: "fn", r: () => ins("ln("),  ar: () => ins("e^(") },

  { l: "\u221a", a: "\u221b", c: "fn", r: () => ins("\u221a("), ar: () => ins("\u221b(") },
  { l: "x<sup>2</sup>", a: "x<sup>3</sup>", c: "fn", r: () => ins("^2"), ar: () => ins("^3") },
  { l: "x<sup>y</sup>", a: "<sup>y</sup>\u221ax", c: "fn", r: () => ins("^"), ar: () => ins("^(1\u00f7") },
  { l: "n!", a: "|x|", c: "fn", r: () => ins("!"), ar: () => ins("abs(") },
  { l: "1/x", a: "Rand", c: "fn", r: () => ins("1\u00f7("), ar: () => ins(String(Math.round(Math.random() * 1e6) / 1e6)) },

  { l: "(", c: "fn", r: () => ins("(") },
  { l: ")", c: "fn", r: () => ins(")") },
  { l: "sinh", a: "sinh<sup>\u22121</sup>", c: "fn", r: () => ins("sinh("), ar: () => ins("asinh(") },
  { l: "cosh", a: "cosh<sup>\u22121</sup>", c: "fn", r: () => ins("cosh("), ar: () => ins("acosh(") },
  { l: "tanh", a: "tanh<sup>\u22121</sup>", c: "fn", r: () => ins("tanh("), ar: () => ins("atanh(") },

  { l: "MC", c: "mem", r: () => memOp("MC") },
  { l: "MR", c: "mem", r: () => memOp("MR") },
  { l: "M+", c: "mem", r: () => memOp("M+") },
  { l: "M\u2212", c: "mem", r: () => memOp("M-") },
  { l: "MS", c: "mem", r: () => memOp("MS") }
];

const PAD = [
  { l: "AC", c: "ctl", r: clearAll },
  { l: "\u232b", c: "ctl", r: backspace, label: "Backspace" },
  { l: "%", c: "op", r: () => ins("%") },
  { l: "\u00f7", c: "op", r: () => ins("\u00f7") },
  { l: "7", c: "num", r: () => ins("7") }, { l: "8", c: "num", r: () => ins("8") },
  { l: "9", c: "num", r: () => ins("9") }, { l: "\u00d7", c: "op", r: () => ins("\u00d7") },
  { l: "4", c: "num", r: () => ins("4") }, { l: "5", c: "num", r: () => ins("5") },
  { l: "6", c: "num", r: () => ins("6") }, { l: "\u2212", c: "op", r: () => ins("\u2212") },
  { l: "1", c: "num", r: () => ins("1") }, { l: "2", c: "num", r: () => ins("2") },
  { l: "3", c: "num", r: () => ins("3") }, { l: "+", c: "op", r: () => ins("+") },
  { l: "\u00b1", c: "num", r: negate, label: "Toggle sign" },
  { l: "0", c: "num", r: () => ins("0") },
  { l: ".", c: "num", r: () => ins(".") },
  { l: "=", c: "eq", r: equals }
];

function build(list, host, isSci) {
  list.forEach(k => {
    const b = document.createElement("button");
    b.className = "k " + k.c;
    b.type = "button";
    b.innerHTML = k.l;
    if (k.id) b.id = k.id;
    if (k.label) b.setAttribute("aria-label", k.label);
    if (isSci && k.a) { b.dataset.main = k.l; b.dataset.alt = k.a; }
    b.addEventListener("click", () => {
      if (isSci && k.ar && state.second) { k.ar(); toggleSecond(false); }
      else k.r();
    });
    host.appendChild(b);
  });
}
build(SCI, $("sci"), true);
build(PAD, $("pad"), false);

/* ---------- history ---------- */
function renderHistory() {
  const box = $("hList");
  box.innerHTML = "";
  if (!state.history.length) {
    box.innerHTML = '<div class="h-empty">No calculations yet</div>'; return;
  }
  state.history.forEach(h => {
    const d = document.createElement("div");
    d.className = "h-item";
    const e = document.createElement("div"); e.className = "e"; e.textContent = h.e + " =";
    const r = document.createElement("div"); r.className = "r"; r.textContent = h.r;
    d.append(e, r);
    d.addEventListener("click", () => {
      state.expr = h.r; state.evaluated = false; state.error = null;
      $("history").classList.remove("open"); render();
    });
    box.appendChild(d);
  });
}
$("btnHistory").addEventListener("click", () => $("history").classList.toggle("open"));
$("btnCloseHist").addEventListener("click", () => $("history").classList.remove("open"));
$("btnClearHist").addEventListener("click", () => { state.history = []; save(); renderHistory(); });

/* ---------- copy & theme ---------- */
async function copyResult() {
  const v = currentValue();
  if (state.error || v === null || !isFinite(v)) return toast("Nothing to copy");
  try { await navigator.clipboard.writeText(fmt(v)); toast("Copied " + fmt(v)); }
  catch (e) { toast("Copy not available"); }
}
$("btnCopy").addEventListener("click", copyResult);
$("main").addEventListener("click", copyResult);
$("btnTheme").addEventListener("click", () => {
  const html = document.documentElement;
  const next = html.dataset.theme === "dark" ? "light" : "dark";
  html.dataset.theme = next;
  try { localStorage.setItem("quanta-theme", next); } catch (e) {}
});

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  let handled = true;
  if (/^\d$/.test(k)) ins(k);
  else if (k === "+") ins("+");
  else if (k === "-") ins("\u2212");
  else if (k === "*" || k === "x" || k === "X") ins("\u00d7");
  else if (k === "/") ins("\u00f7");
  else if (k === "^") ins("^");
  else if (k === "(" || k === ")") ins(k);
  else if (k === "." || k === ",") ins(".");
  else if (k === "%") ins("%");
  else if (k === "!") ins("!");
  else if (k === "p" || k === "P") ins("\u03c0");
  else if (k === "Enter" || k === "=") equals();
  else if (k === "Backspace") backspace();
  else if (k === "Escape") { if ($("history").classList.contains("open")) $("history").classList.remove("open"); else clearAll(); }
  else handled = false;
  if (handled) e.preventDefault();
});

/* ---------- init ---------- */
try {
  const th = localStorage.getItem("quanta-theme");
  if (th) document.documentElement.dataset.theme = th;
  const h = JSON.parse(localStorage.getItem("quanta-hist") || "[]");
  if (Array.isArray(h)) state.history = h;
} catch (e) {}
renderHistory();
render();
</script>
